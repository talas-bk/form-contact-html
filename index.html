<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content formt</title>
</head>
  <style>
 nav {
            border-bottom: 2px solid black;
            padding: 10px 0;
            display:flex;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: black;

        }
 .contact-form {
  max-width: 500px;
  margin: 1rem auto;
}

.form-row {
  display: flex;
  gap: 1.5rem;
  margin-bottom: 1rem;
}

.form-row label {
  width: 90px;
  padding-top: 0.6rem;
}

.form-row input,
.form-row select,
.form-row textarea {
  flex: 1;
  padding: 0.6rem;
  border: 1px solid #555;
  border-radius: 4px;
  outline: none;
}

.form-row textarea {
  resize: vertical;
  min-height: 100px;
  max-height: 100px;
}

.radio-row input[type="checkbox"]{
    width: 20px;
    height: 20px;
    margin: 0;
}

.radio-row {
    margin-bottom:20px;
    border-bottom: 2px solid black;

}

label input {
   margin: 0px 3px 0px 3px;
   width: 14px;
   height: 14px;
}

.radio-row p {
    margin: 1rem 0 ;
}

.radio-row label{
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0.6rem 0 0 ;
}

fieldset {
    border: none;
}


button {
    margin: 20px 0 ;
    padding: 0.5rem; 
    border-radius: 5px; 
    background-color:inherit;
}

</style>
<body>
 <main>
        <h1>Acme Support</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Help</a>
            <a href="#">Contact</a>
        </nav>
 <form class="contact-form" action="/" method="post">
  <h2>Contact us</h2>
  <p>Send us a message and we will get back to you.</p>

  <div class="form-row">
    <label for="fname">Full name</label>
    <input id="fname" name="fname" type="text" required>
  </div>

  <div class="form-row">
    <label for="eemail">Email</label>
    <input id="eemail" name="eemail" type="email" required>
  </div>

  <div class="form-row">
    <label for="subject">Subject</label>
    <select id="subject" name="subject" required>
      <option selected disabled>Choose a topic</option>
      <option value="general">General question</option>
      <option value="support">Support</option>
      <option value="feedback">Feedback</option>
    </select>
  </div>

  <div class="form-row">
    <label for="message">Message</label>
    <textarea id="message" name="message" minlength="200"></textarea>
  </div>

   <fieldset class="radio-row">
         <legend>How did you hear about us?</legend>
          <label>
             <input type="radio" name="choise" id="search">
              Search
          </label>

            <label>
             <input type="radio" name="choise" id="social">
              Social Media
            </label>

            <label>
             <input type="radio" name="choise" id="friends">
               Friends
            </label>

          <label for="checkbox">
            <input type="checkbox" name="product_updates" id="checkbox">
              Send me product updates
          </label>

         <button type="submit">Send message</button>
    </fieldset>
  </form>
</main>

     <footer>
         <span>&copy; 2026 Acme Support</span>
     </footer>
</body>
</html>
